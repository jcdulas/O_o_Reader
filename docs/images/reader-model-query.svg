<text x="65" y="412" font-size="20" fill="#43546d">Model columns and</text>
<text x="65" y="436" font-size="20" fill="#43546d">metadata</text>
<rect x="415" y="330" width="290" height="125" rx="12" fill="#f3edfc" stroke="#7951a8" stroke-width="1.5"/>
<rect x="416" y="344" width="4" height="97" rx="2" fill="#7951a8"/>
<text x="435" y="355" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">RESULTS/ARCHIVE</text>
<text x="435" y="383" font-size="21" font-weight="700">ArchiveModel</text>
<text x="435" y="412" font-size="20" fill="#43546d">Typed fields, model</text>
<text x="435" y="436" font-size="20" fill="#43546d">schema 1</text>
<rect x="785" y="330" width="290" height="125" rx="12" fill="#fff5df" stroke="#a56b18" stroke-width="1.5"/>
<rect x="786" y="344" width="4" height="97" rx="2" fill="#a56b18"/>
<text x="805" y="355" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a56b18">TEXT RECORD LAYOUT</text>
<text x="805" y="383" font-size="21" font-weight="700">Layout catalogue</text>
<text x="805" y="412" font-size="20" fill="#43546d">Compact values to slots</text>
<rect x="415" y="535" width="290" height="125" rx="12" fill="#e9f6f2" stroke="#237d69" stroke-width="1.5"/>
<rect x="416" y="549" width="4" height="97" rx="2" fill="#237d69"/>
<text x="435" y="560" font-size="12" font-weight="700" letter-spacing="1.2" fill="#237d69">MODEL</text>
<text x="435" y="588" font-size="21" font-weight="700">Typed model tables</text>
<text x="435" y="617" font-size="20" fill="#43546d">Columns, IDs, controls,</text>
<text x="435" y="641" font-size="20" fill="#43546d">parts</text>
<rect x="45" y="535" width="290" height="125" rx="12" fill="#e9f6f2" stroke="#237d69" stroke-width="1.5"/>
<rect x="46" y="549" width="4" height="97" rx="2" fill="#237d69"/>
<text x="65" y="560" font-size="12" font-weight="700" letter-spacing="1.2" fill="#237d69">ANALYSIS</text>
<text x="65" y="588" font-size="21" font-weight="700">Model analysis</text>
<text x="65" y="617" font-size="20" fill="#43546d">Geometry, mass, frames</text>
<rect x="785" y="535" width="290" height="125" rx="12" fill="#f3edfc" stroke="#7951a8" stroke-width="1.5"/>
<rect x="786" y="549" width="4" height="97" rx="2" fill="#7951a8"/>
<text x="805" y="560" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">RESULTS</text>
<text x="805" y="588" font-size="21" font-weight="700">Selected results</text>
<text x="805" y="617" font-size="20" fill="#43546d">Metadata and selected</text>
<text x="805" y="641" font-size="20" fill="#43546d">values</text>
<rect x="415" y="760" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="416" y="774" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="435" y="785" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">QUERY</text>
<text x="435" y="813" font-size="21" font-weight="700">Named query / plan</text>
<text x="435" y="842" font-size="20" fill="#43546d">Stored + computed data</text>
<rect x="785" y="760" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="786" y="774" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="805" y="785" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">OUTPUT</text>
<text x="805" y="813" font-size="21" font-weight="700">QueryTable</text>
<text x="805" y="842" font-size="20" fill="#43546d">Columns, CSV, HDF5,</text>
<text x="805" y="866" font-size="20" fill="#43546d">package</text>
<text x="45" y="950" font-size="16" fill="#43546d">Both inputs build the same model tables, including controls, parts and source metadata.</text>
<text x="45" y="974" font-size="16" fill="#43546d">Model analysis derives geometry and mass without running a finite element solve.</text>
<text x="45" y="998" font-size="16" fill="#43546d">Query buffers stay inside Reader; table packages cross the boundary to another module.</text>
</g>
</svg>
