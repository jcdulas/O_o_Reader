<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title description">
<title id="title">From records to query tables</title>
<desc id="description">The lexer preserves sections, comments and includes. ModelFileReader uses the layout catalogue to build typed tables. Queries combine stored columns, computed model data and selected results.</desc>
<rect width="100%" height="100%" rx="18" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#1c2e48">
<text x="36" y="40" font-size="13" font-weight="700" letter-spacing="1.5" fill="#52647e">ARCHITECTURE</text>
<text x="36" y="77" font-size="28" font-weight="700">From records to query tables</text>
