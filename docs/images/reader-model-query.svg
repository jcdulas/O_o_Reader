<polygon points="335,435 347,440 347,430" fill="#50627b"/>
<path d="M335 407 H370 V510 H930 V555" fill="none" stroke="#50627b" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="930,555 935,543 925,543" fill="#50627b"/>
<rect x="45" y="135" width="290" height="125" rx="12" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/>
<rect x="46" y="149" width="4" height="97" rx="2" fill="#64748b"/>
<text x="65" y="160" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">INPUT</text>
<text x="65" y="188" font-size="21" font-weight="700">.oos model text</text>
<text x="65" y="217" font-size="20" fill="#43546d">Sections, records,</text>
<text x="65" y="241" font-size="20" fill="#43546d">includes</text>
<rect x="415" y="135" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="416" y="149" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="435" y="160" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">DECK</text>
<text x="435" y="188" font-size="21" font-weight="700">ModelFileLexer</text>
<text x="435" y="217" font-size="20" fill="#43546d">Tokens and source</text>
<text x="435" y="241" font-size="20" fill="#43546d">metadata</text>
<rect x="785" y="135" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="786" y="149" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="805" y="160" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">MODEL</text>
<text x="805" y="188" font-size="21" font-weight="700">ModelFileReader</text>
<text x="805" y="217" font-size="20" fill="#43546d">Read and validate fields</text>
<rect x="785" y="345" width="290" height="125" rx="12" fill="#fff5df" stroke="#a56b18" stroke-width="1.5"/>
<rect x="786" y="359" width="4" height="97" rx="2" fill="#a56b18"/>
<text x="805" y="370" font-size="12" font-weight="700" letter-spacing="1.2" fill="#a56b18">EMBEDDED DATA</text>
<text x="805" y="398" font-size="21" font-weight="700">Layout catalogue</text>
<text x="805" y="427" font-size="20" fill="#43546d">Compact values to slots</text>
<rect x="415" y="345" width="290" height="125" rx="12" fill="#e9f6f2" stroke="#237d69" stroke-width="1.5"/>
<rect x="416" y="359" width="4" height="97" rx="2" fill="#237d69"/>
<text x="435" y="370" font-size="12" font-weight="700" letter-spacing="1.2" fill="#237d69">MODEL</text>
<text x="435" y="398" font-size="21" font-weight="700">Typed model tables</text>
<text x="435" y="427" font-size="20" fill="#43546d">Columns, references, IDs</text>
<rect x="45" y="345" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="46" y="359" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="65" y="370" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">QUERY</text>
<text x="65" y="398" font-size="21" font-weight="700">Named query / plan</text>
<text x="65" y="427" font-size="20" fill="#43546d">Stored + computed data</text>
<rect x="45" y="555" width="290" height="125" rx="12" fill="#e9f6f2" stroke="#237d69" stroke-width="1.5"/>
<rect x="46" y="569" width="4" height="97" rx="2" fill="#237d69"/>
<text x="65" y="580" font-size="12" font-weight="700" letter-spacing="1.2" fill="#237d69">ANALYSIS</text>
<text x="65" y="608" font-size="21" font-weight="700">Model analysis</text>
<text x="65" y="637" font-size="20" fill="#43546d">Geometry, mass, frames</text>
<rect x="415" y="555" width="290" height="125" rx="12" fill="#f3edfc" stroke="#7951a8" stroke-width="1.5"/>
<rect x="416" y="569" width="4" height="97" rx="2" fill="#7951a8"/>
<text x="435" y="580" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">RESULTS</text>
<text x="435" y="608" font-size="21" font-weight="700">Selected results</text>
<text x="435" y="637" font-size="20" fill="#43546d">Table metadata and values</text>
<rect x="785" y="555" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="786" y="569" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="805" y="580" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">OUTPUT</text>
<text x="805" y="608" font-size="21" font-weight="700">QueryTable</text>
<text x="805" y="637" font-size="20" fill="#43546d">Columns, CSV, HDF5,</text>
<text x="805" y="661" font-size="20" fill="#43546d">package</text>
<text x="45" y="742" font-size="16" fill="#43546d">Parsing creates typed model data. Model analysis derives quantities without running a finite element solve.</text>
<text x="45" y="766" font-size="16" fill="#43546d">Query buffers can be shared inside the reader; a package is the transport boundary to another module.</text>
</g>
</svg>
