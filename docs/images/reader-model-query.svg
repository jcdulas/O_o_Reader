<rect x="45" y="135" width="290" height="125" rx="12" fill="#f0f3f7" stroke="#64748b" stroke-width="1.5"/>
<rect x="46" y="149" width="4" height="97" rx="2" fill="#64748b"/>
<text x="65" y="160" font-size="12" font-weight="700" letter-spacing="1.2" fill="#64748b">TEXT INPUT</text>
<text x="65" y="188" font-size="21" font-weight="700">.oos model text</text>
<text x="65" y="217" font-size="20" fill="#43546d">Sections, records,</text>
<text x="65" y="241" font-size="20" fill="#43546d">includes</text>
<rect x="415" y="135" width="290" height="125" rx="12" fill="#edf3ff" stroke="#4366b3" stroke-width="1.5"/>
<rect x="416" y="149" width="4" height="97" rx="2" fill="#4366b3"/>
<text x="435" y="160" font-size="12" font-weight="700" letter-spacing="1.2" fill="#4366b3">DECK</text>
<text x="435" y="188" font-size="21" font-weight="700">ModelFileLexer</text>
<text x="435" y="217" font-size="20" fill="#43546d">Tokens and source</text>
<text x="435" y="241" font-size="20" fill="#43546d">metadata</text>
