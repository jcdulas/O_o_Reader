<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1040" viewBox="0 0 1120 1040" role="img" aria-labelledby="title description">
<title id="title">Two model inputs, shared query tables</title>
<desc id="description">Text records pass through the lexer and layout catalogue. Native archive columns pass through ArchiveModel as typed fields. Both construct the same model tables used by analysis and model/result queries.</desc>
<rect width="100%" height="100%" rx="18" fill="#f8fafc"/>
<g font-family="sans-serif" fill="#1c2e48">
<text x="36" y="40" font-size="13" font-weight="700" letter-spacing="1.5" fill="#52647e">ARCHITECTURE</text>
<text x="36" y="77" font-size="28" font-weight="700">Two model inputs, shared query tables</text>
