<rect x="786" y="619" width="4" height="107" rx="2" fill="#7951a8"/>
<text x="805" y="630" font-size="12" font-weight="700" letter-spacing="1.2" fill="#7951a8">EXPORT</text>
<text x="805" y="658" font-size="21" font-weight="700">Workbook writer</text>
<text x="805" y="687" font-size="20" fill="#43546d">Index and result sheets</text>
<text x="45" y="776" font-size="16" fill="#43546d">Result values load by selection. model() loads and attaches the optional model separately.</text>
<text x="45" y="800" font-size="16" fill="#43546d">Archive writing includes the attached model and preserves embedded models when copying.</text>
