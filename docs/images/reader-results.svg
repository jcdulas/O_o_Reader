<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="815" viewBox="0 0 1120 815" role="img" aria-labelledby="title description">
<title id="title">Archive indexes and independent lazy loading</title>
<desc id="description">A model/results archive opens its result indexes first. Result selection loads table values; model() separately loads and attaches the optional model. Memory results share the same result interfaces.</desc>
